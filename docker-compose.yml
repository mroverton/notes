# Two services that make up the running system:
#   db  — Postgres, holding users / notes / shares
#   app — the FastAPI service, talking to db over the private compose network
#
# Both read configuration from your local `.env` file (copy it from .env.example).
# Start everything with:  docker compose up --build

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Exposed on localhost:5432 so you can run the test suite from your host.
      - "5432:5432"
    volumes:
      # Named volume persists data across container restarts.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `app` waits until this passes, so it never starts before the DB is ready.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      # Inside the compose network the database host is the service name `db`.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
